[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phm-temporal-qa"
version = "0.1.0"
description = "A provenance-aware benchmark foundation for temporal QA over PHM data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
phm-tqa-validate = "phm_tqa.validate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

